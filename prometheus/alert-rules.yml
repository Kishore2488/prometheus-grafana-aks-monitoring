groups:
  - name: node-and-pod-health
    rules:
      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total[5m])) by (pod) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is using >85% CPU"
          description: "Sustained high CPU for 10 minutes — check for a runaway process or undersized limits."

      - alert: PodRestartingFrequently
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting frequently"
          description: "More than 3 restarts in 15 minutes usually means a crash loop, not a transient blip."

      # Prometheus can't reliably alert on its own downtime from inside itself.
      # In production this is paired with an external dead-man's-switch check
      # (e.g. a heartbeat ping to an uptime service) rather than a local rule.
      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.instance }} is down"
